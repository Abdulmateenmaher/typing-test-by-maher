name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level; the deploy job opts into pages/id-token.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci

      # Fails fast (with a clear message) when Pages is not enabled for the repo,
      # instead of failing later inside deploy-pages with a bare "status: 404".
      # To let the workflow enable Pages itself, set `enablement: true` and pass a
      # PAT (repo scope) via secret: with -> token: ${{ secrets.PAGES_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5